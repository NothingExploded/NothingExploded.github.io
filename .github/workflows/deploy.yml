name: Build and deploy to GitHub Pages

on:
  # Déploiement à chaque push sur la branche principale
  push:
    branches:
      - main

  # Permet de lancer le workflow manuellement depuis l'onglet Actions
  workflow_dispatch:

# Permissions nécessaires au déploiement GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement concurrent à la fois ; les exécutions en attente sont
# écrasées, mais une exécution en cours n'est jamais annulée afin de laisser
# aboutir les déploiements de production.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Version de Zola utilisée en intégration continue (voir README : ≥ 0.23.6).
  ZOLA_VERSION: "0.23.6"

jobs:
  # Un seul job, comme le workflow officiel GitHub Pages : un job `deploy`
  # séparé avec `needs: build` et `environment: github-pages` peut déclencher
  # une approbation manuelle et laisser le run bloqué en « waiting ».
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build site with Zola
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zola.tar.gz -C /tmp
          /tmp/zola build --output-dir public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
